   </g>
   <g id="text_3">
    <text style="font-style: italic; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #121212" x="86.688" y="130.455714" transform="rotate(-0 86.688 130.455714)">“Thank you for your email.”</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #767676" x="484.128" y="150.909978" transform="rotate(-0 484.128 150.909978)"> opening thank-you — 88%</text>
   </g>
   <g id="text_5">
    <text style="font-style: italic; font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #121212" x="86.688" y="177.384286" transform="rotate(-0 86.688 177.384286)">“Unfortunately …”  [body, median 54 words]</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #767676" x="484.128" y="197.838549" transform="rotate(-0 484.128 197.838549)"> the word itself appears in 28% of replies</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #121212" x="86.688" y="224.312857" transform="rotate(-0 86.688 224.312857)">“We wish you all the best.”</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #767676" x="484.128" y="244.767121" transform="rotate(-0 484.128 244.767121)"> well-wishing line — 51%</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #121212" x="86.688" y="271.241429" transform="rotate(-0 86.688 271.241429)">“Kind regards,”</text>
